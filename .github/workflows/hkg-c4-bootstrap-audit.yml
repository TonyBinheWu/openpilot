name: HKG C4 bootstrap audit
on:
  push:
    branches: [audit/hkg-c4-bootstrap-20260923]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Read exact audit source
        run: |
          GIT_LFS_SKIP_SMUDGE=1 timeout 240 git clone --depth=1 --branch audit/hkg-c4-bootstrap-20260923 https://github.com/TonyBinheWu/sunnypilot.git source
          cd source
          git rev-parse HEAD
          cat launch_env.sh
          git ls-files -s launch_openpilot.sh launch_chffrplus.sh openpilot/common/hardware/comma/updater
      - name: Check MICI installer and AGNOS download endpoints
        run: |
          cd source
          python3 -u - <<'PY'
          import concurrent.futures, hashlib, json, re, urllib.request
          base='https://install.sunnypilot.ai/fork/TonyBinheWu/hkg-enhanced'
          for device in ('mici','tizi'):
            req=urllib.request.Request(base,headers={'User-Agent':'AGNOSSetup-19.7','X-openpilot-device-type':device})
            with urllib.request.urlopen(req,timeout=30) as r:
              payload=r.read(20*1024*1024+1)
            assert payload[:4]==b'\x7fELF'
            print('INSTALLER',device,len(payload),hashlib.sha256(payload).hexdigest())
            for s in re.findall(rb'[\x20-\x7e]{8,}',payload):
              if b'TonyBinheWu' in s or b'hkg-enhanced' in s: print(s.decode())
          manifest=json.load(open('openpilot/system/hardware/comma/agnos.json'))
          def probe(p):
            try:
              req=urllib.request.Request(p['url'],headers={'Range':'bytes=0-63'})
              with urllib.request.urlopen(req,timeout=20) as r:
                head=r.read(64)
                return {'partition':p['name'],'status':r.status,'magic':head[:6].hex(),'xz':head.startswith(bytes.fromhex('fd377a585a00')),'type':r.headers.get('Content-Type')}
            except Exception as e:
              return {'partition':p['name'],'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            for result in pool.map(probe,manifest): print('AGNOS_ENDPOINT',json.dumps(result))
          print('Endpoint probes do not execute or flash AGNOS.')
          PY
      - name: Verify updater object and ELF dependencies
        run: |
          cd source
          timeout 180 git lfs pull --include='openpilot/common/hardware/comma/updater'
          git lfs fsck --objects --include='openpilot/common/hardware/comma/updater' || true
          p=openpilot/common/hardware/comma/updater
          sha256sum "$p"
          file "$p"
          readelf -h "$p" | head -n 20
          readelf -d "$p" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          readelf --version-info "$p" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 5
      - name: Run bootstrap regression tests when present
        run: |
          cd source
          if [ -f tools/tests/test_hkg_bootstrap.py ]; then
            python3 -m unittest discover -s tools/tests -p test_hkg_bootstrap.py -v
          fi
          bash -n launch_openpilot.sh launch_chffrplus.sh launch_env.sh
          git diff --check
          echo 'Not a C4 hardware boot or vehicle validation.'
