# Page: software
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: software
label: Software
icon: software
order: 7
remote_configurable: true
description: Software update preferences
sections:
- id: updates
  title: Updates
  description: Control software updates
  items:
  - key: DisableUpdates
    widget: toggle
    title: Disable Updates
    description: When enabled, software updates will be off. This requires a reboot to take effect.
    enablement:
    - $ref: '#/macros/offroad'
  - key: SunnylinkUpdateNow
    widget: toggle
    title: Check and Download Update
    description: One-time request to check and download the latest commit of the installed branch. The switch resets after the request.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: DisableUpdates
      equals: false
  - key: SunnylinkInstallUpdate
    widget: toggle
    title: Install Downloaded Update
    description: Request once to arm for 60 seconds, then request again to confirm reboot and installation. Requires a staged update, offroad device, and ignition off. Refresh between requests if the switch still appears on.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: UpdateAvailable
      equals: true
    - type: param
      key: DisableUpdates
      equals: false
  - key: UpdaterState
    widget: info
    title: Update Progress
  - key: SunnylinkUpdateRequestStatus
    widget: info
    title: Remote Update Request
  - key: UpdaterCurrentDescription
    widget: info
    title: Installed Version
  - key: UpdaterNewDescription
    widget: info
    title: Downloaded Version
  - key: LastUpdateException
    widget: info
    title: Last Update Error
